<!DOCTYPE html>
<html lang="it">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mediblei | Esercizio CSS Grid</title>
    <link rel="stylesheet" href="css/style.css">
</head>

<body>
    <main class="container">
        <!-- Il profilo completo verrà aggiunto dopo aver costruito la griglia. -->
        <header class="profile-placeholder">
            <h1>Mediblei</h1>
            <p>Qui inseriremo il profilo di Mediblei.</p>
        </header>

        <section class="posts" aria-labelledby="posts-title">
            <h2 id="posts-title">Post</h2>
            <!-- Solo i figli diretti di questo contenitore sono grid item. -->
            <div class="posts-grid">
                <div class="post">
                    <img src="img/incipit.jpg" alt="Teatro antico in pietra con il titolo Incipit">
                </div>
                <div class="post">
                    <img src="img/saluti-dallo-spazio.jpg" alt="Fotomontaggio di gruppo in tute da astronauta: Saluti dallo spazio">
                </div>
                <div class="post">
                    <img src="img/laboratorio-nina.jpg" alt="Locandina del laboratorio con Nina per Capolettera, con una volpe illustrata">
                </div>
                <div class="post">
                    <img src="img/cinematti.jpg" alt="Locandina Cinematti con popcorn, pizza e pellicola cinematografica">
                </div>
                <div class="post">
                    <img src="img/capolettera-angelo-ruta.jpg" alt="Locandina Capolettera incontra Angelo Ruta, con volti tra foglie verdi">
                </div>
                <div class="post">
                    <img src="img/tre-soste.jpg" alt="Locandina 3 soste wine tasting con una raffigurazione di San Sebastiano">
                </div>
            </div>
        </section>
    </main>
</body>

</html>
