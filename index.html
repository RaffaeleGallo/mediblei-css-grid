<!DOCTYPE html>
<html lang="it">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mediblei | Esercizio CSS Grid</title>
    <link rel="icon" type="image/png" href="img/logo-mediblei.png">
    <link rel="stylesheet" href="css/style.css">
</head>

<body>
    <main class="container">
        <header class="profile">
            <img class="profile-avatar" src="img/logo-mediblei.png"
                alt="Logo MIB Mediblei, visioni di comunità" width="150" height="150">
            <h1>Mediblei APS</h1>
            <p class="profile-username">@mib_mediblei</p>

            <div class="profile-bio">
                <p>Libri, arte e cultura nel cuore degli Iblei.</p>
                <p>Mostre, incontri e percorsi alla scoperta del territorio.</p>
                <p>Uno spazio di comunità a Palazzolo Acreide.</p>
            </div>

            <a class="profile-website" href="https://www.mediblei.com/">www.mediblei.com</a>
            <a class="profile-instagram" href="https://www.instagram.com/mib_mediblei/">
                Visita il profilo Instagram
            </a>
        </header>

        <section class="posts" aria-labelledby="posts-title">
            <h2 id="posts-title">Post</h2>
            <!-- Solo i figli diretti di questo contenitore sono grid item. -->
            <div class="posts-grid">
                <div class="post">
                    <img src="img/incipit.jpg" alt="Teatro antico in pietra con il titolo Incipit">
                </div>
                <div class="post">
                    <img src="img/saluti-dallo-spazio.jpg" alt="Fotomontaggio di gruppo in tute da astronauta: Saluti dallo spazio">
                </div>
                <div class="post">
                    <img src="img/mostra-antonio-vacirca.jpg" alt="Visitatori alla mostra fotografica di Antonio Vacirca a Spazio San Sebastiano">
                </div>
                <div class="post">
                    <img class="post-image-top" src="img/mostri-agata-leocata.jpg" alt="Locandina Mostri, elogio dell’imperfezione di Agata Leocata, con una creatura dipinta">
                </div>
                <div class="post">
                    <img src="img/capolettera-angelo-ruta.jpg" alt="Locandina Capolettera incontra Angelo Ruta, con volti tra foglie verdi">
                </div>
                <div class="post">
                    <img class="post-image-top" src="img/itinerari-di-coraggio.jpg" alt="Locandina Itinerari di coraggio, cent’anni di Pippo Fava, con ritratto e scritte arancioni">
                </div>
            </div>
        </section>
    </main>
</body>

</html>
